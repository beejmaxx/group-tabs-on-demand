<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152338"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <clipPath id="browserClip">
      <rect x="56" y="282" width="1168" height="330" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1160" cy="76" r="230" fill="#2dd4bf" opacity=".07"/>
  <circle cx="82" cy="760" r="240" fill="#60a5fa" opacity=".06"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="92" fill="#5eead4" font-size="19" font-weight="700" letter-spacing="2.4">GROUP TABS ON DEMAND</text>
    <text x="56" y="170" fill="#fff" font-size="58" font-weight="700">One click. Tabs grouped.</text>
    <text x="56" y="224" fill="#a9b7ca" font-size="27">Organize by domain when you choose—never automatically.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="282" width="1168" height="330" rx="18" fill="#fff"/>
    <g clip-path="url(#browserClip)">
      <image x="56" y="282" width="1168" height="106" preserveAspectRatio="none" xlink:href="tab-groups.png"/>
      <rect x="56" y="388" width="1168" height="224" fill="#f8fafc"/>
      <rect x="106" y="428" width="318" height="126" rx="16" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
      <rect x="481" y="428" width="318" height="126" rx="16" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
      <rect x="856" y="428" width="318" height="126" rx="16" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>

      <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
        <text x="265" y="472" fill="#0f172a" font-size="24" font-weight="700">BY DOMAIN</text>
        <text x="265" y="510" fill="#64748b" font-size="19">Clean, predictable groups</text>
        <text x="640" y="472" fill="#0f172a" font-size="24" font-weight="700">ON DEMAND</text>
        <text x="640" y="510" fill="#64748b" font-size="19">Nothing moves until you click</text>
        <text x="1015" y="472" fill="#0f172a" font-size="24" font-weight="700">SELF-REPAIRING</text>
        <text x="1015" y="510" fill="#64748b" font-size="19">Mixed groups get fixed</text>
      </g>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="696" fill="#fff" font-size="29" font-weight="700">Group Tabs on Demand</text>
    <text x="56" y="735" fill="#94a3b8" font-size="21">Private, local, and deliberately simple.</text>
  </g>
  <g transform="translate(1110 666) scale(.75)">
    <path d="M14 38v52M43 38v52M57 54h18M57 74h18M92 38v52M106 38v52" fill="none" stroke="#5eead4" stroke-linecap="round" stroke-width="9"/>
  </g>
</svg>
